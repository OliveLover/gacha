basePath: /api/v1
definitions:
  dto.AvatarResponse:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      key:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  dto.CapsuleResponse:
    properties:
      id:
        type: string
      message:
        type: string
      nickname:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.SignUpRequest:
    properties:
      avatar_id:
        type: string
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: string
      nickname:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Project Gacha
  version: "1.0"
paths:
  /avatars:
    get:
      description: 활성화된 아바타 목록을 정렬 순서대로 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AvatarResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 아바타 목록 조회
      tags:
      - avatars
  /avatars/{id}:
    get:
      description: 활성화된 아바타를 ID로 조회합니다.
      parameters:
      - description: 아바타 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AvatarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 아바타 조회
      tags:
      - avatars
  /capsules:
    post:
      description: 캡슐의 메시지를 작성합니다.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CapsuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 캡슐 메시지 1개 작성
      tags:
      - capsules
  /capsules/draw:
    post:
      description: 아직 뽑히지 않은 캡슐 중 하나를 랜덤으로 뽑아 메시지와 작성자 닉네임을 반환합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CapsuleResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 캡슐 1개 랜덤 뽑기
      tags:
      - capsules
  /login:
    post:
      consumes:
      - application/json
      description: 이메일/비밀번호로 사용자를 인증하고 JWT를 발급합니다.
      parameters:
      - description: 로그인 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 로그인
      tags:
      - users
  /signup:
    post:
      consumes:
      - application/json
      description: 이메일/이름/닉네임/비밀번호로 새 계정을 생성합니다.
      parameters:
      - description: 회원가입 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 회원가입
      tags:
      - users
swagger: "2.0"
