<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <title>Gacha</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="index-page">
        <header class="header">
            <a
                href="/login"
                id="login-link"
                class="btn btn-primary"
                style="
                    --bs-btn-padding-y: 0.3rem;
                    --bs-btn-padding-x: 0.6rem;
                    --bs-btn-font-size: 0.9rem;
                    --bs-btn-bg: #3d3a1e;
                    --bs-btn-border-color: #3d3a1e;
                    --bs-btn-hover-bg: #55512a;
                    --bs-btn-hover-border-color: #55512a;
                "
            >
                로그인
            </a>

            <div class="dropdown d-none" id="profile-area">
                <button
                    class="user-avatar"
                    id="profile-circle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                ></button>
                <span id="header-nickname" class="header-nickname"></span>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text" id="profile-nickname"></span></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li class="dropdown-item-text">
                        <span class="avatar-picker-label">프로필 사진 변경</span>
                        <div id="header-avatar-picker" class="avatar-picker"></div>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                        <button class="dropdown-item" type="button" onclick="logout()">
                            로그아웃
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <main class="gacha-section">
            <div class="gacha-machine">
                <img
                    src="/static/images/objects/capsule-machin.png"
                    class="machine-img"
                    alt="가챠 머신"
                />
                <button class="machine-knob" id="gacha-knob" onclick="pullGacha()">
                    <img
                        id="knob-img"
                        src="/static/images/objects/machine-labor_1.png"
                        alt="손잡이"
                    />
                </button>
                <img id="gacha-capsule" class="gacha-capsule" alt="캡슐" />
            </div>

            <div id="capsule-result" class="capsule-result d-none">
                <p id="capsule-result-nickname" class="capsule-result-nickname"></p>
                <p id="capsule-result-message" class="capsule-result-message"></p>
            </div>

            <form id="capsule-form" class="capsule-form">
                <textarea
                    id="capsule-message"
                    class="form-control"
                    rows="2"
                    maxlength="300"
                    placeholder="캡슐에 담을 메시지를 적어주세요"
                    required
                ></textarea>
                <button type="submit" class="btn w-100 auth-submit-btn">캡슐에 담기</button>
                <p id="capsule-form-message" class="mt-2"></p>
            </form>
        </main>

        <script src="/static/script.js"></script>
    </body>
</html>
