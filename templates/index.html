<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <title>Gacha</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="index-page">
        <header class="header">
            <a
                href="/login"
                id="login-link"
                class="btn btn-primary"
                style="
                    --bs-btn-padding-y: 0.3rem;
                    --bs-btn-padding-x: 0.6rem;
                    --bs-btn-font-size: 0.9rem;
                    --bs-btn-bg: #3d3a1e;
                    --bs-btn-border-color: #3d3a1e;
                    --bs-btn-hover-bg: #55512a;
                    --bs-btn-hover-border-color: #55512a;
                "
            >
                로그인
            </a>

            <div class="dropdown d-none" id="profile-area">
                <button
                    class="user-avatar"
                    id="profile-circle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                ></button>
                <span id="header-nickname" class="header-nickname"></span>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text" id="profile-nickname"></span></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li class="dropdown-item-text">
                        <span class="avatar-picker-label">프로필 사진 변경</span>
                        <div id="header-avatar-picker" class="avatar-picker"></div>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                        <button class="dropdown-item" type="button" onclick="logout()">
                            로그아웃
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <main class="gacha-section">
            <button
                type="button"
                class="btn auth-submit-btn"
                data-bs-toggle="modal"
                data-bs-target="#capsule-write-modal"
            >
                캡슐에 담기
            </button>

            <div class="gacha-machine">
                <img
                    src="/static/images/objects/capsule-machin.png"
                    class="machine-img"
                    alt="가챠 머신"
                />
                <div id="capsule-pile" class="capsule-pile"></div>
                <button class="machine-knob" id="gacha-knob" onclick="pullGacha()">
                    <img
                        id="knob-img"
                        src="/static/images/objects/machine-labor_1.png"
                        alt="손잡이"
                    />
                </button>
                <div id="gacha-capsule-shadow" class="capsule-shadow"></div>
                <img
                    id="gacha-capsule"
                    class="gacha-capsule"
                    alt="캡슐"
                    onclick="showCapsuleModal()"
                />
            </div>

            <div class="modal fade" id="capsule-modal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content capsule-modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modal-capsule-nickname"></h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"
                            ></button>
                        </div>
                        <div class="modal-body">
                            <p id="modal-capsule-message" class="mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="capsule-write-modal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content capsule-modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">캡슐에 메시지 담기</h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"
                            ></button>
                        </div>
                        <div class="modal-body">
                            <form id="capsule-form" class="capsule-form">
                                <textarea
                                    id="capsule-message"
                                    class="form-control"
                                    rows="3"
                                    maxlength="300"
                                    placeholder="캡슐에 담을 메시지를 적어주세요"
                                    required
                                ></textarea>
                                <button type="submit" class="btn w-100 auth-submit-btn">
                                    캡슐에 담기
                                </button>
                                <p id="capsule-form-message" class="mt-2 mb-0"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="/static/script.js"></script>
    </body>
</html>
