<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <title>Gacha</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="index-page">
        <header class="header">
            <a
                href="/login"
                id="login-link"
                class="btn btn-primary"
                style="
                    --bs-btn-padding-y: 0.3rem;
                    --bs-btn-padding-x: 0.6rem;
                    --bs-btn-font-size: 0.9rem;
                    --bs-btn-bg: #3d3a1e;
                    --bs-btn-border-color: #3d3a1e;
                    --bs-btn-hover-bg: #55512a;
                    --bs-btn-hover-border-color: #55512a;
                "
            >
                로그인
            </a>

            <div class="dropdown d-none" id="profile-area">
                <button
                    class="user-avatar"
                    id="profile-circle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                ></button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text" id="profile-nickname"></span></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li class="dropdown-item-text">
                        <span class="avatar-picker-label">프로필 사진 변경</span>
                        <div id="header-avatar-picker" class="avatar-picker"></div>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                        <button class="dropdown-item" type="button" onclick="logout()">
                            로그아웃
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <script src="/static/script.js"></script>
    </body>
</html>
